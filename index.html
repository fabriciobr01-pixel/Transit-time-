<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL TRANSIT TIME</title>
    <style>
        :root {
            --export: #f97316;
            --import: #2563eb;
            --green: #16a34a;
            --red: #dc2626;
            --bg: #f1f5f9;
        }
        body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        header { 
            display: flex; align-items: center; justify-content: space-between; 
            background: linear-gradient(135deg, #020617, #0f172a, #1e293b); 
            color: white; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; 
        }
        .header-center { text-align: center; flex: 1; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 20px; }

        .card { background: white; padding: 15px; border-radius: 10px; border-top: 6px solid #ccc; transition: 0.3s; display: flex; flex-direction: column; }
        .card.export { border-top-color: var(--export); }
        .card.import { border-top-color: var(--import); }

        .prefix-display { font-size: 2.2rem; font-weight: 900; text-align: center; padding: 14px; border-radius: 10px; margin-bottom: 8px; letter-spacing: 2px; background: #eee; color: #666; }
        .prefix-import { background: #dbeafe; color: #1d4ed8; border: 3px solid #2563eb; }
        .prefix-export { background: #ffedd5; color: #ea580c; border: 3px solid #f97316; }

        .timer { 
            font-size: 2rem; text-align: center; font-weight: bold; padding: 12px; 
            border-radius: 8px; font-family: monospace; transition: 0.3s;
            background: #000; color: #fff; border: 2px solid transparent; 
        }

        .timer.ok { background: var(--green); color: white; }
        .timer.late { background: var(--red); color: white; }

        @keyframes pulseAlert {
            0% { background: #000; color: #ff0000; box-shadow: 0 0 5px red; transform: scale(1); }
            50% { background: #ff0000; color: #fff; box-shadow: 0 0 30px red; transform: scale(1.05); }
            100% { background: #000; color: #ff0000; box-shadow: 0 0 5px red; transform: scale(1); }
        }
        .timer.warning { animation: pulseAlert 0.8s infinite; border: 3px solid red !important; }

        /* MINI HISTÓRICO NO CARD */
        .card-history { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; font-size: 0.75rem; color: #444; }
        .card-history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .card-history-title { font-weight: bold; text-transform: uppercase; color: #64748b; }
        .btn-clear-mini { background: #fee2e2; color: #dc2626; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.65rem; width: auto; margin: 0; }
        .mini-hist-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #eee; }

        .result { font-weight: bold; text-align: center; margin: 10px 0; min-height: 1.2em; font-size: 1.1rem; }
        .result.ok { color: var(--green); }
        .result.late { color: var(--red); }

        input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { padding: 10px; margin-top: 5px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; width: 100%; }
        .btn-start { background: #16a34a; color: white; }
        .btn-end { background: #2563eb; color: white; }
        .btn-clear { background: #ef4444; color: white; }
        .btn-actions { display: flex; gap: 5px; }
        .btn-actions button { width: 33%; }

        .history { margin-top: 30px; background: white; padding: 20px; border-radius: 12px; overflow-x: auto; }
        .history-btns { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .history-btns button { width: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f1f5f9; }
        .tempo-pos { color: var(--green); font-weight: bold; }
        .tempo-neg { color: var(--red); font-weight: 900; }
    </style>
</head>
<body>

<header>
    <div></div>
    <div class="header-center"><h1>TRANSIT TIME</h1></div>
    <div id="clock"></div>
</header>

<div class="dashboard" id="cards"></div>

<div class="history">
    <h3>📋 Histórico Geral</h3>
    <div class="history-btns">
        <button onclick="exportCSV()" style="background:#10b981; color:white;">📊 Exportar CSV</button>
        <button onclick="exportJSON()" style="background:#6366f1; color:white;">📤 Backup</button>
        <button onclick="document.getElementById('file').click()" style="background:#8b5cf6; color:white;">📥 Importar</button>
        <button onclick="limparHistorico()" style="background:#b91c1c; color:white;">🧹 Limpar Tudo</button>
    </div>
    <input type="file" id="file" hidden onchange="importJSON(event)">
    <table>
        <thead>
            <tr>
                <th>Trem ID</th>
                <th>Prefixo</th>
                <th>Sentido</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Diferença</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="hist"></tbody>
    </table>
</div>

<script>
const METAS = { "PIZ X PFL": 3.75, "PFL X PIZ": 3.5 };
let timers = {};

setInterval(() => {
    document.getElementById("clock").innerText = new Date().toLocaleString("pt-BR");
}, 1000);

const cardsContainer = document.getElementById("cards");
for(let i=1; i<=6; i++){
    cardsContainer.innerHTML += `
    <div class="card" id="card-${i}">
        <h3>TREM ${i}</h3>
        <div id="prefix-display-${i}" class="prefix-display">---</div>
        <input id="prefix-${i}" placeholder="Prefixo" oninput="updatePrefix(${i})">
        <select id="type-${i}" onchange="setTipo(${i}); updatePrefix(${i})">
            <option value="PIZ X PFL">EXPORTAÇÃO (03:45h)</option>
            <option value="PFL X PIZ">IMPORTAÇÃO (03:30h)</option>
        </select>
        <input type="datetime-local" id="start-${i}">
        <input type="datetime-local" id="end-${i}">
        <div class="timer" id="timer-${i}">00:00:00</div>
        <div id="result-${i}" class="result"></div>
        <div class="btn-actions">
            <button class="btn-start" onclick="start(${i})">INICIAR</button>
            <button class="btn-end" onclick="stop(${i})">FINALIZAR</button>
            <button class="btn-clear" onclick="clearCard(${i})">LIMPAR</button>
        </div>
        <div class="card-history">
            <div class="card-history-header">
                <span class="card-history-title">Últimas Viagens</span>
                <button class="btn-clear-mini" onclick="limparHistoricoTrem(${i})">Zerar Histórico</button>
            </div>
            <div id="mini-hist-${i}"></div>
        </div>
    </div>`;
}

function updatePrefix(id){
    const val = document.getElementById(`prefix-${id}`).value.toUpperCase();
    const tipo = document.getElementById(`type-${id}`).value;
    const el = document.getElementById(`prefix-display-${id}`);
    el.innerText = val || "---";
    el.className = val ? "prefix-display " + (tipo === "PFL X PIZ" ? "prefix-import" : "prefix-export") : "prefix-display";
}

function setTipo(id){
    const tipo = document.getElementById(`type-${id}`).value;
    const card = document.getElementById(`card-${id}`);
    card.classList.remove("export","import");
    card.classList.add(tipo === "PFL X PIZ" ? "import" : "export");
}

function start(id){
    setTipo(id);
    updatePrefix(id);
    const startInput = document.getElementById(`start-${id}`);
    if(!startInput.value) startInput.value = new Date().toISOString().slice(0,16);
    const limite = new Date(startInput.value).getTime() + (METAS[document.getElementById(`type-${id}`).value] * 3600000);
    clearInterval(timers[id]);
    timers[id] = setInterval(() => atualizarTimer(id, limite), 1000);
    atualizarTimer(id, limite);
}

function formatDiff(ms) {
    const abs = Math.abs(ms);
    const h = Math.floor(abs / 3600000);
    const m = Math.floor((abs % 3600000) / 60000);
    return (ms < 0 ? "-" : "+") + `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function atualizarTimer(id, limite){
    const diff = limite - Date.now();
    const el = document.getElementById(`timer-${id}`);
    const abs = Math.abs(diff);
    const h = Math.floor(abs / 3600000);
    const m = Math.floor((abs % 3600000) / 60000);
    const s = Math.floor((abs % 60000) / 1000);
    el.innerText = (diff < 0 ? "-" : "") + `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    if(diff <= 3600000 && diff > 0) el.className = "timer warning";
    else if (diff < 0) el.className = "timer late";
    else el.className = "timer ok";
}

function stop(id){
    clearInterval(timers[id]);
    const prefix = document.getElementById(`prefix-${id}`).value || `---`;
    const tipo = document.getElementById(`type-${id}`).value;
    const inicio = document.getElementById(`start-${id}`).value;
    let fim = document.getElementById(`end-${id}`);
    if(!fim.value) fim.value = new Date().toISOString().slice(0,16);
    
    const limite = new Date(inicio).getTime() + (METAS[tipo] * 3600000);
    const saldoMs = limite - new Date(fim.value).getTime();
    const tempoFormatado = formatDiff(saldoMs);
    const status = saldoMs >= 0 ? "DENTRO DA META" : "ATRASADO";
    
    document.getElementById(`result-${id}`).innerText = status;
    document.getElementById(`result-${id}`).className = "result " + (saldoMs >= 0 ? "ok" : "late");
    
    const timerEl = document.getElementById(`timer-${id}`);
    timerEl.style.animation = "none";
    timerEl.className = "timer " + (saldoMs >= 0 ? "ok" : "late");

    salvarHistorico({tremId: id, prefix, tipo, inicio, fim: fim.value, tempo: tempoFormatado, status});
}

function clearCard(id){
    clearInterval(timers[id]); 
    document.getElementById(`prefix-${id}`).value = "";
    document.getElementById(`start-${id}`).value = "";
    document.getElementById(`end-${id}`).value = "";
    document.getElementById(`prefix-display-${id}`).innerText = "---";
    document.getElementById(`prefix-display-${id}`).className = "prefix-display";
    const timerEl = document.getElementById(`timer-${id}`);
    timerEl.innerText = "00:00:00";
    timerEl.style.animation = "none";
    timerEl.className = "timer";
    document.getElementById(`result-${id}`).innerText = "";
    document.getElementById(`card-${id}`).className = "card";
}

function salvarHistorico(reg){
    let hist = JSON.parse(localStorage.getItem("hist")) || [];
    hist.unshift(reg);
    localStorage.setItem("hist", JSON.stringify(hist));
    render();
}

function render(){
    let hist = JSON.parse(localStorage.getItem("hist")) || [];
    
    document.getElementById("hist").innerHTML = hist.map(r => `
        <tr>
            <td>Trem ${r.tremId}</td>
            <td>${r.prefix}</td>
            <td>${r.tipo}</td>
            <td>${r.inicio.replace("T"," ")}</td>
            <td>${r.fim.replace("T"," ")}</td>
            <td class="${r.tempo.startsWith('+') ? 'tempo-pos' : 'tempo-neg'}">${r.tempo}</td>
            <td><strong>${r.status}</strong></td>
        </tr>
    `).join("");

    for(let i=1; i<=6; i++){
        const miniHistEl = document.getElementById(`mini-hist-${i}`);
        const tremHist = hist.filter(h => h.tremId === i).slice(0, 3);
        
        miniHistEl.innerHTML = tremHist.length ? tremHist.map(h => `
            <div class="mini-hist-item">
                <span>${h.prefix}</span>
                <span class="${h.tempo.startsWith('+') ? 'tempo-pos' : 'tempo-neg'}">${h.tempo}</span>
                <span>${h.status === "ATRASADO" ? "❌" : "✅"}</span>
            </div>
        `).join("") : "<div style='opacity:0.5'>Sem registros.</div>";
    }
}

function limparHistoricoTrem(id) {
    if(confirm(`Deseja apagar o histórico apenas do Trem ${id}?`)) {
        let hist = JSON.parse(localStorage.getItem("hist")) || [];
        // Filtra para remover apenas o trem específico
        let novoHist = hist.filter(h => h.tremId !== id);
        localStorage.setItem("hist", JSON.stringify(novoHist));
        render();
    }
}

function exportCSV(){
    let hist = JSON.parse(localStorage.getItem("hist")) || [];
    let csv = "\uFEFFTrem;Prefixo;Sentido;Inicio;Fim;Diferenca;Status\n";
    hist.forEach(r => { csv += `Trem ${r.tremId};${r.prefix};${r.tipo};${r.inicio};${r.fim};${r.tempo};${r.status}\n`; });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    a.download = `historico_transit_${new Date().toLocaleDateString()}.csv`;
    a.click();
}

function exportJSON(){
    let a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([localStorage.getItem("hist")], { type: "application/json" }));
    a.download = "backup_transit.json";
    a.click();
}

function importJSON(event){
    let reader = new FileReader();
    reader.onload = (e) => { localStorage.setItem("hist", e.target.result); render(); alert("Importado!"); };
    reader.readAsText(event.target.files[0]);
}

function limparHistorico(){
    if(confirm("Limpar TODO o histórico geral?")){ localStorage.removeItem("hist"); render(); }
}

render();
</script>
</body>
</html>
